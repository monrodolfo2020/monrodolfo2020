<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta name="theme-color" content="#ec5b13"/>
  <meta name="description" content="Aprende inglés con canciones famosas. 12 semanas de gramática a través de música."/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>

  <!-- Anti-flash dark mode: must be first -->
  <script>
    (function() {
      try {
        var p = JSON.parse(localStorage.getItem('melodic_past_progress') || '{}');
        if (p.darkMode) document.documentElement.classList.add('dark');
      } catch(e) {}
    })();
  </script>

  <!-- Tailwind Config -->
  <script>
    tailwind = { config: {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ec5b13",
            "background-light": "#f8f6f6",
            "background-dark": "#221610",
          },
          fontFamily: { "display": ["Inter", "sans-serif"] },
          borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <title>The Melodic Past — Aprende Inglés con Música</title>
  <style>
    body { min-height: max(884px, 100dvh); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
    .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400; }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen pb-28">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-900 shadow-sm sticky top-0 z-50">
    <div class="flex items-center justify-between px-6 py-4 max-w-2xl mx-auto w-full">
      <div class="flex items-center gap-3">
        <div class="bg-primary/10 p-2 rounded-lg">
          <span class="material-symbols-outlined text-primary">music_note</span>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">The Melodic Past</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 -mt-0.5">Inglés a través de la música</p>
        </div>
      </div>
      <button onclick="window.location.href='profile.html'" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
        <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">account_circle</span>
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-6">

    <!-- Hero / Progress Card -->
    <div class="relative overflow-hidden rounded-xl bg-primary p-8 text-white shadow-xl shadow-primary/20">
      <div class="relative z-10">
        <h2 id="hero-title" class="text-3xl font-bold mb-2">0/12 Semanas Completadas</h2>
        <p class="text-white/80 mb-6">¡Aprende inglés cantando tus canciones favoritas!</p>
        <div class="flex flex-col gap-2 mb-8">
          <div class="flex justify-between items-end">
            <span class="text-sm font-medium">Progreso del Curso</span>
            <span id="hero-pct" class="text-lg font-bold">0%</span>
          </div>
          <div class="h-3 w-full bg-white/20 rounded-full overflow-hidden">
            <div id="hero-bar" class="h-full bg-white rounded-full transition-all duration-700" style="width: 0%"></div>
          </div>
        </div>
        <button id="start-btn" class="bg-white text-primary px-8 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-slate-50 transition-colors shadow-lg">
          <span>Empezar a Aprender</span>
          <span class="material-symbols-outlined">play_arrow</span>
        </button>
      </div>
      <!-- Decorative Background -->
      <div class="absolute -right-8 -bottom-8 opacity-20">
        <span class="material-symbols-outlined text-[180px]">album</span>
      </div>
    </div>

    <!-- Lesson Cards -->
    <div class="mt-8 space-y-6">
      <h3 class="text-lg font-bold px-2 text-slate-800 dark:text-slate-200">Ruta de Aprendizaje</h3>
      <div id="lessons-container" class="space-y-4">
        <!-- Rendered by app.js -->
        <div class="flex items-center justify-center py-16">
          <div class="animate-spin rounded-full h-8 w-8 border-2 border-primary border-t-transparent"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 z-50">
    <div class="flex max-w-2xl mx-auto px-4 py-2">
      <a href="index.html" data-nav="lessons" class="flex flex-1 flex-col items-center justify-center gap-1 py-1 text-primary transition-colors">
        <span class="material-symbols-outlined fill-icon text-[22px]">school</span>
        <span class="text-[10px] font-bold uppercase tracking-wider">Lecciones</span>
      </a>
      <a href="discover.html" data-nav="discover" class="flex flex-1 flex-col items-center justify-center gap-1 py-1 text-slate-500 dark:text-slate-400 hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[22px]">explore</span>
        <span class="text-[10px] font-bold uppercase tracking-wider">Explorar</span>
      </a>
      <a href="profile.html" data-nav="profile" class="flex flex-1 flex-col items-center justify-center gap-1 py-1 text-slate-500 dark:text-slate-400 hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[22px]">person</span>
        <span class="text-[10px] font-bold uppercase tracking-wider">Perfil</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { renderLessonsGrid, updateHeroProgress } from './js/app.js';
    renderLessonsGrid('lessons-container');
    updateHeroProgress();
  </script>

  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

</body>
</html>
