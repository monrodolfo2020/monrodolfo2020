# A string used to distinguish different Supabase projects on the same host.
project_id = "mall-management"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true
# Expose these tables via Realtime broadcast/presence/postgres-changes
# Configure per-table replication in Supabase Dashboard > Database > Replication
# or via SQL: ALTER PUBLICATION supabase_realtime ADD TABLE <table>;
ip_version = "IPv4"
max_header_length = 4096

[realtime.tenant_limits]
max_concurrent_users       = 200
max_events_per_second      = 100
max_bytes_per_second       = 102400

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
